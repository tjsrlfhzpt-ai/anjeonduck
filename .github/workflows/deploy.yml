name: 빌드·배포

on:
  push:
    branches: [main]
  schedule:
    # 매일 오전 6시 10분(KST) — 시트 변경 반영, 마감 공고 정리
    - cron: "10 21 * * *"
    # 매주 월요일 오전 7시 20분(KST) — 링크 점검 포함
    - cron: "20 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 구글 시트 → 데이터 (설정한 경우만)
        env:
          JOB_POSTS_CSV: ${{ vars.JOB_POSTS_CSV }}
        run: python3 scripts/sync_sheets.py
      - name: 공공데이터포털 API → 채용·뉴스·사고속보 (저장소 변수 PUBLIC_API=true 일 때만)
        if: vars.PUBLIC_API == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_public.py
      - name: 정적 페이지 생성
        run: python3 build.py --out _site
      - name: 링크 점검 (주 1회 또는 수동 실행)
        if: github.event.schedule == '20 22 * * 0' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_links.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
