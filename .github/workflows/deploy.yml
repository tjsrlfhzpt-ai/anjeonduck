name: 빌드·배포

on:
  push:
    branches: [main]
  schedule:
    # 매일 오전 6시 10분(KST) — 시트 변경 반영, 마감 공고 정리
    - cron: "10 21 * * *"
    # 매주 월요일 오전 7시 20분(KST) — 링크 점검 포함
    - cron: "20 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 구글 시트 → 데이터 (설정한 경우만)
        env:
          JOB_POSTS_CSV: ${{ vars.JOB_POSTS_CSV }}
        run: python3 scripts/sync_sheets.py
      - name: 공공데이터포털 API → 채용·뉴스·사고속보 (저장소 변수 PUBLIC_API=true 일 때만)
        if: vars.PUBLIC_API == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_public.py
      - name: 공공데이터포털 API → 사고사망 속보만 (PUBLIC_API 를 켜지 않았을 때. 인증키가 없으면 건너뜀)
        if: vars.PUBLIC_API != 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_public.py --accidents-only
      - name: 정적 페이지 생성
        run: python3 build.py --out _site
      - name: 법령 별표 원본 대조 (적용범위 판정 데이터)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || echo "poppler 설치 실패 — 대조 건너뜀"
          python3 scripts/verify_tables.py
      - name: 법령 데이터·표현 감사 (버전·시행일·출처·금지 표현·필수 안내 — 오류면 배포 중단)
        run: python3 scripts/audit.py _site
      - name: 국가법령정보센터 연혁 비교 (주 1회 또는 수동 실행, 접속 실패는 경고만)
        if: github.event.schedule == '20 22 * * 0' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 scripts/audit.py --online
      - name: 링크 점검 (주 1회 또는 수동 실행)
        if: github.event.schedule == '20 22 * * 0' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_links.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: 검색엔진에 변경 알림 (IndexNow — 실패해도 배포는 유지)
        continue-on-error: true
        run: |
          sleep 20
          python3 scripts/indexnow.py
