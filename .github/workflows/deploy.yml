name: 빌드·배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 21 * * *"
    - cron: "20 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 구글 시트 → 데이터 (설정한 경우만)
        run: python3 scripts/sync_sheets.py
      - name: 정적 페이지 생성
        run: python3 build.py --out _site
      - name: 링크 점검 (주 1회 또는 수동 실행)
        if: github.event.schedule == '20 22 * * 0' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_links.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
