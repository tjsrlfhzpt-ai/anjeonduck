name: 법령 변경 자동 감지

# 국가법령정보센터 OPEN API(인증키: 저장소 Secret LAW_OC)로 새 공포번호를 찾아
# data/laws.json 개정 소식에 '확인 필요' 항목으로 넣는다. 개정 내용은 운영자가 원문으로 확인한다.
# 2026-10-13: GitHub 실행 서버에서 www.law.go.kr 접속이 모두 실패(URLError)해 주간 자동 실행을 껐다.
# 법령 변경 확인은 주간 예약 작업(Claude, 법령 연혁 페이지 확인)이 맡는다. 수동 실행은 그대로 남긴다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "확인만 하고 파일은 바꾸지 않기"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: law-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: OPEN API 조회 → 새 공포번호 등록
        id: watch
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python3 scripts/law_watch.py $DRY --report law_watch_report.md
          cat law_watch_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 빌드·감사 (오류면 커밋하지 않음)
        if: steps.watch.outputs.new != '0' && !inputs.dry_run
        run: |
          python3 build.py --out _site
          python3 scripts/audit.py _site

      - name: data/laws.json 커밋·push, 배포 실행, 운영자 알림 이슈
        if: steps.watch.outputs.new != '0' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/laws.json
          git commit -m "법령 변경 자동 감지 $TODAY"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
          gh issue create --title "새 법령 개정 감지 $TODAY — 원문 확인 필요" --body-file law_watch_report.md

      - name: 조회 실패가 있으면 실패로 표시 (GitHub 실패 알림 메일)
        if: steps.watch.outputs.failed != '0'
        run: |
          echo "확인 못 한 법령이 ${{ steps.watch.outputs.failed }}건 있습니다 — 실행 요약을 확인하세요."
          exit 1
