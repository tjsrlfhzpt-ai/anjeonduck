name: 유튜브 영상 목록 동기화

# 유튜브 채널(data/videos.json youtube_channel_id)에 새로 공개된 영상을 사이트 영상 목록에 자동으로 추가하고,
# 썸네일이 없는 영상은 자체 썸네일(assets/img/videos/<id>.webp)을 받아 둔다. 바뀐 게 있으면 저장 후 빌드·배포를 부른다.
# 쇼츠 예약 공개가 오전 8시라 그 뒤인 오전 8시 40분(KST)에 매일 실행. 수동 실행도 가능.
on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_videos.py
      - .github/workflows/sync-videos.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 준비 (썸네일 변환용 Pillow, 작성기 이름 확인용 빌드)
        run: |
          pip install --quiet pillow
          python3 build.py --out _site > /dev/null || echo "빌드 실패 — 작성기 이름 없이 진행"
      - name: 채널 피드 → data/videos.json, 썸네일 받기
        run: python3 scripts/sync_videos.py
      - name: 바뀐 내용 저장
        id: save
        run: |
          git config user.name "safeplum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json assets/img/videos
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; echo "새 영상·썸네일 없음"; exit 0; fi
          git commit -m "영상 목록 동기화: 유튜브 채널 새 영상·썸네일 반영"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: 빌드·배포 부르기
        if: steps.save.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
