name: 채용 수집(요청 시)

# 회사 자체 채용 홈페이지 공고를 운영자가 요청할 때만 수집한다(매일 자동 실행 없음).
# 결과(data/cojobs.json)를 저장소에 남기고 빌드·배포를 이어서 부른다.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: (시험) 경기 잡아바 모집분야 포함 수집 — 저장·배포 안 함
        env:
          GG_DATA_KEY: ${{ secrets.GG_DATA_KEY }}
        run: python3 scripts/fetch_jobaba.py
