name: 채용 수집(요청 시)

# 회사 자체 채용 홈페이지 공고를 운영자가 요청할 때만 수집한다(매일 자동 실행 없음).
# 결과(data/cojobs.json)를 저장소에 남기고 빌드·배포를 이어서 부른다.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: (시험) 공공기관 채용정보(ALIO) API — 저장·배포 안 함
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python3 - <<'PY'
          import importlib.util, json
          s = importlib.util.spec_from_file_location("fp", "scripts/fetch_public.py"); fp = importlib.util.module_from_spec(s); s.loader.exec_module(fp)
          print("키 있음:", bool(fp.KEY))
          try:
              fp.fetch_jobs()
              d = json.load(open(fp.OUT / "pubjobs.json"))
              print("ALIO 안전·보건 공고:", len(d["items"]))
              for x in d["items"]: print(" ", x["company"], "|", x["title"][:50], "|", x["region"], "| ~", x["deadline"])
          except Exception as e:
              print("ALIO 실패:", type(e).__name__, str(e)[:300])
          PY
