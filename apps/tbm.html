<body class="v-form">

<div class="sitebar no-print">
  <a href="../../">← SafePlum</a>
  <span>입력 내용은 이 기기 브라우저에만 저장되고 서버로 전송되지 않습니다.</span>
</div>

<div class="toolbar no-print">
  <div class="tabs" role="tablist" aria-label="화면 전환">
    <button type="button" role="tab" id="tabForm" aria-selected="true" data-act="view" data-v="form">입력</button>
    <button type="button" role="tab" id="tabPrev" aria-selected="false" data-act="view" data-v="prev">미리보기</button>
  </div>
  <h1>TBM 일지 작성기</h1>
  <div class="tb-acts">
    <button type="button" class="btn btn-green" data-act="print">🖨️ 인쇄 / PDF 저장</button>
    <button type="button" class="btn btn-blue" id="histBtn" data-act="hist">📂 지난 일지</button>
    <button type="button" class="btn btn-line" id="todayBtn" data-act="today" hidden>오늘 일지로</button>
    <button type="button" class="btn btn-line" data-act="reset">↻ 초기화</button>
  </div>
  <p class="tb-status" id="saveStatus" role="status" aria-live="polite"></p>
</div>

<div class="shell">
  <aside class="fpane no-print" id="fpane" aria-label="입력">
    <div id="form"></div>
    <p class="f-note">산업안전보건법 제36조제4항은 중대재해로 이어질 수 있는 유해·위험 요인을 "작업 전 안전점검회의 등을 통하여 근로자에게 상시적으로 주지시키도록 노력"하도록 정하고 있습니다. 위험요인 목록은 예시이므로 오늘 작업에 맞게 고쳐 쓰세요. 이 안내는 인쇄되지 않습니다.</p>
  </aside>
  <main class="ppane" id="ppane" aria-label="미리보기">
    <div id="pages-wrapper"></div>
    <div class="page-container photo-page" id="tbmPhotosPage"><table class="sheet"><thead><tr><td class="sp"></td></tr></thead><tbody><tr><td id="tbmPhotosCell"></td></tr></tbody><tfoot><tr><td class="sp"></td></tr></tfoot></table></div>
  </main>
</div>

<div id="toolModal" class="modal-overlay no-print">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="toolModalTitle">

    </div>

      <select class="fin" id="pickGroup" aria-label="공종"></select>
      <input class="fin" id="pickQ" type="search" placeholder="검색 (예: 끼임, 지게차)" aria-label="위험요인 검색">
    </div>
    <div id="tool-list" class="modal-body"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  // 위험요인 목록: SafePlum 빌드 때 data/hazards.json 이 들어간다
  var HAZARD_DB = /*@HAZARDS@*/null;
  if (!HAZARD_DB || !Array.isArray(HAZARD_DB.groups) || !HAZARD_DB.groups.length) HAZARD_DB = { groups: ["공통"], items: [] };

      var t = e.target;
      if (e.key === "Escape") { closeModal(); return; }
      if (t && t.classList && t.classList.contains("tool-cell") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPicker(+t.dataset.pi, +t.dataset.ri); return; }
      if (e.key === "Enter" && !e.isComposing && t && t.classList && t.classList.contains("e")) {
        if (t.hasAttribute("data-one")) { e.preventDefault(); t.blur(); }
        else if (CE === "true") { e.preventDefault(); document.execCommand("insertText", false, "\n"); }
      }
    });
    // 문서 칸에는 글자만 붙여 넣는다(서식·그림 제외)
    document.addEventListener("paste", function (e) {
      var t = e.target && e.target.closest ? e.target.closest(".e") : null; if (!t) return;
      e.preventDefault();
      var tx = (e.clipboardData || window.clipboardData).getData("text") || "";
      if (t.hasAttribute("data-one")) tx = tx.replace(/\s*\n+\s*/g, " ");
      document.execCommand("insertText", false, tx);
    });
    document.addEventListener("drop", function (e) { if (e.target && e.target.closest && e.target.closest(".e")) e.preventDefault(); });
    // 결재란(공통 모듈)이 바뀌면 단계 요약과 보관함의 서명을 맞춘다
    document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest(".ad-appr, .ad-ctl, .ad-modal")) setTimeout(function () { heads(); if (signSnap() || touched) saveSoon(); fit(); }, 60); });
    document.addEventListener("input", function (e) { if (e.target.closest && e.target.closest("[data-appr], #fAppr")) setTimeout(function () { heads(); fit(); }, 0); });
    window.addEventListener("resize", fit);
    window.addEventListener("pagehide", function () { if (saveTimer) saveNow(); });
    document.addEventListener("visibilitychange", function () { if (document.hidden && saveTimer) saveNow(); });
    window.addEventListener("beforeprint", function () { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if (saveTimer) saveNow(); });
    // 빌드 때 본문 끝에 붙는 화면용 안내문은 입력 칸 아래로 옮긴다(인쇄에는 나오지 않음)
    document.addEventListener("DOMContentLoaded", function () { var n = document.querySelector("body > .adk-note"); if (n) $("fpane").appendChild(n); fit(); });
  })();
})();
</script>
</body>
