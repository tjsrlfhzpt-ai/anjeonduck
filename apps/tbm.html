<style>
  @page { size: A4; margin: 0; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Dotum', sans-serif; margin: 0; padding: 0; background-color: #555; }

  .page-container {
    background-color: white; width: 210mm; height: 297mm;
    margin: 10mm auto; padding: 10mm; box-sizing: border-box;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    page-break-after: always; position: relative; overflow: hidden;
  }
  @media print {
    body { background-color: white; margin: 0; padding: 0; }
    .page-container { margin: 0; box-shadow: none; border: none; }
    .control-panel, .modal-overlay, .no-print, .sitebar { display: none !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    ::placeholder { color: transparent !important; }
    select { appearance: none; -webkit-appearance: none; }
  }

  /* SafePlum 상단 바 */
  .sitebar { background:#fff; border-bottom:1px solid #d8dee8; padding:8px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; }
  .sitebar a { color:#1F6FD1; text-decoration:none; font-weight:700; }
  .sitebar span { color:#5b6b80; }

  /* 컨트롤 패널 */
  .control-panel {
    background-color: #1b365d; color: white; padding: 10px; text-align: center;
    position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #002244;
    display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .ctrl-group { display:flex; align-items:center; gap:6px; }
  .ctrl-note { width:100%; font-size:12px; color:#c9d6ea; }
  .btn { padding: 6px 14px; cursor: pointer; border-radius: 4px; font-weight: bold; border: none; font-size: 13px; }
  .btn-green { background: #27ae60; color: white; }
  .btn-blue { background: #2980b9; color: white; }
  .btn-red { background: #c0392b; color: white; }
  .btn-circle { width: 25px; height: 25px; border-radius: 50%; background: #4a6984; color: white; border: none; cursor: pointer; font-weight: bold; }
  .page-count-display { font-size: 18px; font-weight: bold; margin: 0 6px; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 4px; }
  .data-table { border: 2px solid #333; }
  .data-table th, .data-table td {
    border: 1px solid #000 !important; padding: 2px 3px; font-size: 8.5pt;
    vertical-align: middle; text-align: center; word-break: keep-all;
  }
  th { font-weight: bold; color: #2c3e50; background: linear-gradient(to bottom, #fdfdfd 0%, #e0e0e0 100%); }
  .th-blue { background: linear-gradient(to bottom, #e8f4f8 0%, #d1e8f0 100%) !important; color: #1b365d; }
  .th-gold { background: linear-gradient(to bottom, #fffde7 0%, #fff59d 100%) !important; color: #5d4037; }
  .th-grey { background: linear-gradient(to bottom, #f5f5f5 0%, #e0e0e0 100%) !important; }

  input, textarea, select {
    width: 100%; border: none; background: transparent;
    font-family: inherit; font-size: inherit; text-align: center;
    outline: none; resize: none; padding: 0; margin: 0; color: inherit;
  }
  input:focus, textarea:focus { background:#fffde7; }
  select { cursor: pointer; font-weight: bold; color: #1b365d; }
  textarea { text-align: left; padding-top: 1px; line-height: 1.3; overflow: hidden; }
  .align-left { text-align: left !important; padding-left: 4px; }
  .align-left input { text-align: left; }
  .date-input { width:auto; display:inline-block; text-align:center; }

  .page-header-info {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 5px; padding: 0 2px 3px; border-bottom: 2px solid #1b365d;
  }
  .company-name-input { font-size: 14px; font-weight: 900; width: 280px; color: #1b365d; text-align: left; }
  .company-name-input::placeholder { color:#9aa8ba; font-weight:700; }
  .company-name-input:hover { background-color: #f0f4f8; }
  .contact-info { font-size: 9.5px; color: #7f8c8d; }

  .refresh-btn { cursor: pointer; }
  .refresh-btn:hover { background: #fff176 !important; color: #d35400; font-weight: bold; }
  .tool-input { cursor: pointer; font-weight: bold; color: #1b365d; }
  .tool-input:hover { background-color: rgba(41, 128, 185, 0.15); }

  .th-label { width: 35mm !important; }
  .layout-wrapper td { vertical-align: bottom; }
  .approval-table th.sign-space { height: 50px !important; }
  .approval-footer { font-size: 7.5pt; height: 16px !important; border-top: 1px double #000 !important; background: #fff !important; color: #c0392b; font-weight: bold; }
  .info-table tr { height: 23px; }
  .work-table td { height: 28px; }

  .risk-table col.col-no { width: 4%; }
  .risk-table col.col-tool { width: 12%; }
  .risk-table col.col-risk { width: 34%; }
  .risk-table col.col-type { width: 9%; }
  .risk-table col.col-lvl { width: 6%; }
  .risk-table col.col-plan { width: 35%; }
  .risk-table th { height: 24px; border-bottom: 2px solid #aaa !important; }
  .risk-table td { height: 32px; }

  .worker-table col.w-no { width: 4%; }
  .worker-table col.w-job { width: 11%; }
  .worker-table col.w-name { width: 12%; }
  .worker-table col.w-sign { width: 13%; }
  .worker-table col.w-note { width: 10%; }
  .worker-table th { height: 20px; font-size: 8pt; }
  .worker-table td { height: 22px; font-size: 8.5pt; }
  .worker-table .split { border-left: 2px solid #333 !important; }

  .main-title {
    font-size: 22pt; font-weight: 900; text-align: center;
    border: 3px double #1b365d; border-radius: 4px;
    padding: 4px; margin-bottom: 6px; letter-spacing: 6px; color: #1b365d;
    background: linear-gradient(to bottom, #ffffff 0%, #f4f7f9 100%);
  }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: white; width: min(640px, 92vw); max-height: 85%; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #1b365d; }
  .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1b365d; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2980b9; padding-bottom: 8px; }
  .modal-close { cursor: pointer; font-size: 26px; font-weight: bold; color: #aaa; background:none; border:0; }
  .modal-close:hover { color: #e74c3c; }
  .modal-body { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .modal-group { font-size:12px; font-weight:bold; color:#5b6b80; margin-top:8px; }
  .tool-btn { padding: 7px 10px; background: #f0f4f8; border: 1px solid #b0bec5; border-radius: 4px; cursor: pointer; font-size: 12.5px; color: #2c3e50; text-align:left; }
  .tool-btn:hover { background: #1b365d; color: white; }
  .tool-btn b { color:#c0392b; margin-right:6px; }
  .tool-btn:hover b { color:#ffd27a; }

  .btn-grey { background: #5b6b80; color: white; }
  .ctrl-note:empty { display: none; }
  .hist-empty { font-size: 13px; color: #5b6b80; line-height: 1.6; margin: 0; }
  .hist-item { border: 1px solid #d8dee8; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .hist-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; color: #2c3e50; }
  .hist-meta span { color: #5b6b80; font-size: 12px; }
  .hist-meta .hist-work { flex-basis: 100%; color: #2c3e50; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-meta .hist-cur { background: #27ae60; color: #fff; border-radius: 3px; padding: 0 5px; font-size: 11px; }
  .hist-acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .hist-acts .btn { font-size: 12px; padding: 5px 10px; }
  .over-warn { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 6px 10px; background: #c0392b; color: #fff; font-size: 12px; font-weight: bold; text-align: center; }
  .over-warn[hidden] { display: none; }
  /* 빌드 때 붙는 안내문(.adk-note)이 어두운 바탕에서도 읽히게 */
  .adk-note { color: #e3e8ef !important; }
  .adk-note a { color: #a9cdfa; }
  /* 좁은 화면: A4 쪽을 화면 폭에 맞춰 줄여 보여 준다(값은 스크립트가 넣음). 인쇄에는 적용하지 않는다 */
  @media screen {
    .page-container { zoom: var(--pz, 1); }
  }
  @media screen and (max-width: 820px) {
    .page-container { margin: 6px auto; }
    .sitebar { font-size: 12px; padding: 6px 10px; }
    .control-panel { position: static; gap: 8px; }
  }
</style>

<div class="sitebar no-print">
  <a href="../../">← SafePlum</a>
  <span>입력 내용은 이 기기 브라우저에만 저장되고 서버로 전송되지 않습니다.</span>
</div>

<div class="control-panel">
  <div class="ctrl-group">
    <span>공종(부서):</span>
    <select id="globalGroup" style="width:auto;background:#fff;color:#1b365d;padding:4px 6px;border-radius:4px;" onchange="applyGroupToAll(this.value)"></select>
  </div>
  <div class="ctrl-group">
    <span>쪽 수:</span>
    <button class="btn-circle" onclick="changeCount(-1)" aria-label="쪽 줄이기">－</button>
    <span id="pageCount" class="page-count-display">1</span>
    <button class="btn-circle" onclick="changeCount(1)" aria-label="쪽 늘리기">＋</button>
  </div>
  <button class="btn btn-blue" id="histBtn" onclick="openHistory()">📂 지난 일지</button>
  <button class="btn btn-blue" onclick="window.addPhotos && addPhotos()">📷 사진 첨부</button>
  <button class="btn btn-green" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
  <button class="btn btn-red" onclick="resetData()">↻ 초기화</button>
  <p class="ctrl-note">위험요인은 선택한 공종의 기본 목록으로 채워집니다. 번호 칸을 누르면 다음 항목, 구분 칸을 누르면 목록에서 고를 수 있습니다. <b>오늘 작업에 맞는지 확인한 뒤 인쇄하세요.</b></p>

<div id="toolModal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="toolModalTitle">
    <div class="modal-header">
      <span id="toolModalTitle">위험요인 선택</span>
      <button class="modal-close" onclick="closeModal()" aria-label="닫기">×</button>
    </div>
    <div id="tool-list" class="modal-body"></div>
  </div>
</div>

<div id="pages-wrapper"></div>

<script>
(function () {
  if (!window.ADoc) { document.getElementById("tbmPhotosPage").style.display = "none"; return; }
  var pg = document.getElementById("tbmPhotosPage");
  ADoc.mountPhotos(document.getElementById("tbmPhotos"), "tool.tbm", { title: "TBM 사진대지 (교육·점검 장면)", cols: 2 });
  function sync() { ADoc.countPhotos("tool.tbm").then(function (c) { pg.classList.toggle("has-photos", c.total > 0); }); }
  ADoc.onPhotos("tool.tbm", sync); sync();
  window.addPhotos = function () { ADoc.pickPhoto("tool.tbm", ""); pg.scrollIntoView({ behavior: "smooth" }); };
})();
</script>

<script>
  // 위험요인 목록: SafePlum 빌드 때 data/hazards.json 이 들어간다
  var HAZARD_DB = /*@HAZARDS@*/null;
  if (!HAZARD_DB) HAZARD_DB = { groups: ["공통"], items: [] };
  var GROUPS = HAZARD_DB.groups;
  var ITEMS = HAZARD_DB.items;
  var STORE_KEY = "safetake.tbm.v1";        // 머리글(회사·현장·공종·작업내용) — 기존 저장 형식 그대로
  var DAYS_KEY = "safetake.tbm.days.v1";    // 날짜별 일지 보관(최근 MAX_DAYS건)
  var MAX_DAYS = 31, ROWS = 5, WORKERS = 30, MAX_PAGES = 10;
  var EMPTY = { group: "", risk: "", type: "", level: "", measure: "" };
  var WEEK = ["일","월","화","수","목","금","토"];
  var STATE_KEYS = ["headerCompany", "siteName", "group", "workArea", "majorPoints"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function todayParts() {
    var d = new Date();
    return { year: String(d.getFullYear()), month: pad2(d.getMonth() + 1), day: pad2(d.getDate()), weekday: WEEK[d.getDay()] };
  }
  function todayYmd() { var t = todayParts(); return t.year + "-" + t.month + "-" + t.day; }
  // 사업장 정보(홈에서 저장한 값)가 있으면 회사명 기본값으로 쓴다
  function profileCompany() {
    try {
      var p = JSON.parse(localStorage.getItem("safetake.profile") || "{}") || {};
      return String(p.company || localStorage.getItem("safetake.company") || "");
    } catch (e) { return ""; }
  }
  function defaultState() {
    var t = todayParts();
    return { headerCompany: profileCompany(), siteName: "", group: GROUPS[0],
             year: t.year, month: t.month, day: t.day, weekday: t.weekday,
             workArea: "", majorPoints: "개인보호구 착용, 위험성평가 항목 숙지, 이상 발견 시 즉시 작업중지·보고" };
  }

  var state = defaultState();
  var doc = { id: "", pages: [] };   // 지금 작성 중인 일지(쪽별 위험요인·의견·명단)
  var touched = false;               // 사용자가 손댄 일지만 날짜별 보관에 넣는다
  var currentRow = null, saveTimer = null;

  function newId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function docYmd() {
    var y = parseInt(state.year, 10), m = parseInt(state.month, 10), d = parseInt(state.day, 10);
    if (!y || !m || !d) return "";
    return y + "-" + pad2(m) + "-" + pad2(d);
  }
  function weekdayOf(y, m, d) {
    y = parseInt(y, 10); m = parseInt(m, 10); d = parseInt(d, 10);
    if (!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    var dt = new Date(y, m - 1, d);
    return dt.getMonth() === m - 1 && dt.getDate() === d ? WEEK[dt.getDay()] : null;
  }

  // 선택한 공종 항목 먼저, 모자라면 공통 항목으로 채움 (무작위 아님)
  function listFor(group) {
    var own = ITEMS.filter(function (i) { return i.group === group; });
    var common = group === "공통" ? [] : ITEMS.filter(function (i) { return i.group === "공통"; });
    return own.concat(common);
  }
  function pick(group, n) {
    var list = listFor(group).slice(0, n);
    while (list.length < n) list.push(EMPTY);
    return list.map(function (it) { return { group: it.group, risk: it.risk, type: it.type, level: it.level, measure: it.measure }; });
  }
  function blankWorkers() { var a = []; for (var i = 0; i < WORKERS; i++) a.push({ org: "", name: "", note: "" }); return a; }
  function newPage(group) { return { group: group, rows: pick(group, ROWS), opinion: "", workers: blankWorkers() }; }
  // 저장된 값이 깨져 있어도 화면이 망가지지 않게 모양을 맞춘다
  function normPage(p) {
    p = p && typeof p === "object" ? p : {};
    var g = GROUPS.indexOf(p.group) >= 0 ? p.group : GROUPS[0], rows = [], ws = [], i, r, w;
    for (i = 0; i < ROWS; i++) { r = (p.rows || [])[i] || {}; rows.push({ group: String(r.group || ""), risk: String(r.risk || ""), type: String(r.type || ""), level: ["상","중","하"].indexOf(r.level) >= 0 ? r.level : "", measure: String(r.measure || "") }); }
    for (i = 0; i < WORKERS; i++) { w = (p.workers || [])[i] || {}; ws.push({ org: String(w.org || ""), name: String(w.name || ""), note: String(w.note || "") }); }
    return { group: g, rows: rows, opinion: String(p.opinion || ""), workers: ws };
  }
  function headCount(pages) {
    var n = 0; (pages || []).forEach(function (p) { (p.workers || []).forEach(function (w) { if (w && String(w.name || "").trim()) n++; }); });
    return n;
  }

  // ---------- 저장 ----------
  function loadDays() {
    try {
      var a = JSON.parse(localStorage.getItem(DAYS_KEY) || "[]");
      return Array.isArray(a) ? a.filter(function (x) { return x && x.id && Array.isArray(x.pages); }) : [];
    } catch (e) { return []; }
  }
  function writeDays(days) {
    days.sort(function (a, b) { return (b.saved || 0) - (a.saved || 0); });
    days = days.slice(0, MAX_DAYS);
    try { localStorage.setItem(DAYS_KEY, JSON.stringify(days)); return true; } catch (e) { return false; }
  }
  function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; } catch (e) { return false; } }
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    var ok = saveState();
    if (touched) {
      var days = loadDays().filter(function (x) { return x.id !== doc.id; }), st = {};
      STATE_KEYS.forEach(function (k) { st[k] = state[k]; });
      days.push({ id: doc.id, date: docYmd(), saved: Date.now(), state: st, pages: doc.pages });
      ok = writeDays(days) && ok;
    }
    setStatus(ok ? (touched ? "이 기기에 저장됨 · " + (docYmd() || "날짜 없음") + " 일지" : "") : "저장하지 못했습니다(저장 공간 부족 또는 사생활 보호 모드). 인쇄는 할 수 있습니다.", !ok);
    updateHistBtn();
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
  function markTouched() { touched = true; saveSoon(); }
  function setStatus(msg, bad) {
    var el = document.getElementById("saveStatus"); if (!el) return;
    el.textContent = msg; el.style.color = bad ? "#ffb4a9" : "";
  }
  function updateHistBtn() {
    var b = document.getElementById("histBtn"); if (!b) return;
    var n = loadDays().length;
    b.textContent = "📂 지난 일지" + (n ? " (" + n + ")" : "");
  }
  function loadState() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { saved = null; }
    state = defaultState();
    if (saved && typeof saved === "object") {
      STATE_KEYS.forEach(function (k) { if (typeof saved[k] === "string") state[k] = saved[k]; });
      // 날짜는 저장값이 아니라 항상 오늘로 시작. 회사명이 비어 있으면 사업장 정보에서 가져온다
      if (!state.headerCompany) state.headerCompany = profileCompany();
    }
    if (GROUPS.indexOf(state.group) < 0) state.group = GROUPS[0];
  }
  // 결재 서명은 날짜가 찍혀 저장된다. 다른 날 서명이 오늘 일지에 그대로 인쇄되지 않게 지운다(칸 이름·성명은 유지)
  function dropStaleSigns() {
    try {
      var k = "safetake.appr.tool.tbm", s = JSON.parse(localStorage.getItem(k) || "null"), ch = false, ymd = docYmd();
      if (!s || !Array.isArray(s.signs)) return;
      s.signs.forEach(function (sg, i) { if (sg && (s.dates || [])[i] !== ymd) { s.signs[i] = null; if (s.dates) s.dates[i] = null; ch = true; } });
      if (ch) localStorage.setItem(k, JSON.stringify(s));

    loadState();
    // 오늘 날짜로 보관된 일지가 있으면 이어서 쓴다
    var today = todayYmd(), days = loadDays().filter(function (x) { return x.date === today; });
    days.sort(function (a, b) { return (b.saved || 0) - (a.saved || 0); });
    if (days[0]) {
      doc = { id: days[0].id, pages: days[0].pages.map(normPage) };
      STATE_KEYS.forEach(function (k) { if (days[0].state && typeof days[0].state[k] === "string") state[k] = days[0].state[k]; });
      if (GROUPS.indexOf(state.group) < 0) state.group = GROUPS[0];
      touched = true;
    } else {
      doc = { id: newId(), pages: [newPage(state.group)] };
    }
    if (!doc.pages.length) doc.pages = [newPage(state.group)];
    dropStaleSigns();
    fitScreen(); syncGroupSelect(); generatePages(); updateHistBtn();
    var prev = loadDays().filter(function (x) { return x.id !== doc.id; });
    if (touched) setStatus("오늘(" + dateLabel(today) + ") 작성하던 일지를 이어서 엽니다.");
    else if (prev.length) setStatus("지난 일지 " + prev.length + "건이 보관되어 있습니다. '지난 일지'에서 명단·내용을 불러올 수 있습니다.");

    var wrap = document.getElementById("pages-wrapper");
    function onEdit(ev) {
      if (!ev.target.closest(".page-container") || ev.target.closest("[data-appr]")) return;
      if (ev.target.tagName === "TEXTAREA") fitText(ev.target.closest(".page-container"));
      readAll(); markTouched();
    }
    wrap.addEventListener("input", onEdit);
    wrap.addEventListener("change", function (ev) { if (ev.target.classList.contains("work-type-select")) return; onEdit(ev); });
    window.addEventListener("resize", fitScreen);
    window.addEventListener("pagehide", function () { if (saveTimer) { readAll(); saveNow(); } });
    document.addEventListener("visibilitychange", function () { if (document.hidden && saveTimer) { readAll(); saveNow(); } });
    window.addEventListener("beforeprint", function () { readAll(); if (saveTimer) saveNow(); });
  })();
</script>
</body>
</html>
